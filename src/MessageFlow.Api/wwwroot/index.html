<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MessageFlow API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; padding: 0; }
    #header { background: #1a1a2e; color: #fff; padding: 12px 24px; font-family: sans-serif; font-size: 16px; }
    #header b { color: #e94560; }
  </style>
</head>
<body>
  <div id="header">MessageFlow API &mdash; <b>Swagger UI</b></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: "/openapi/v1.json",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: "BaseLayout",
      deepLinking: true,
      docExpansion: "list",
    });
  </script>
</body>
</html>
