name: CI

# Compila y ejecuta los tests en cada PR hacia main o PROD y en cada push a main.
# deploy.yml lo reutiliza (workflow_call) antes de construir la imagen de producción.
on:
  pull_request:
    branches: [main, PROD]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # MessageFlow.Tests copia src/MessageFlow.Api/appsettings.json (ignorado en Git)
      # y SemanticSearchConfigurationTests lo exige. En CI se usa el example.
      - name: Preparar appsettings para los tests
        run: cp src/MessageFlow.Api/appsettings.example.json src/MessageFlow.Api/appsettings.json

      - name: Restore
        run: dotnet restore MessageFlow.slnx

      - name: Build
        run: dotnet build MessageFlow.slnx --no-restore -c Release

      # Los tests de integración levantan pgvector/pgvector:pg18 con Testcontainers
      # (ubuntu-latest trae Docker).
      - name: Test
        run: >
          dotnet test MessageFlow.slnx --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
          if-no-files-found: ignore

  docker-build:
    name: Docker build (validación)
    # Solo en PRs: comprueba que el Dockerfile sigue compilando antes de llegar a PROD.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build api (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha,scope=pr
          cache-to: type=gha,scope=pr,mode=max
      - name: Build migrator (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha,scope=pr
