name: Deploy PROD

# Cada push a la rama PROD (normalmente el merge de un PR main → PROD):
#   1. tests        (reutiliza ci.yml en GitHub)
#   2. build        (imágenes ARM64 nativas en ubuntu-24.04-arm → GHCR)
#   3. deploy       (runner self-hosted en la Orange Pi → deploy/deploy.sh)
#
# Rollback manual: Actions → Deploy PROD → Run workflow (rama PROD) con image_tag
# de una versión anterior (p. ej. sha-abc1234). Se salta tests y build.
on:
  push:
    branches: [PROD]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag ya publicado a desplegar (ej. sha-abc1234). Vacío = construir y desplegar el commit actual de PROD"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/messageflow-api
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/messageflow-migrator

jobs:
  test:
    if: github.ref == 'refs/heads/PROD' && !inputs.image_tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ARM64 → GHCR
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Calcular tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.API_IMAGE }}:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Build & push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.MIGRATOR_IMAGE }}:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=arm64

  deploy:
    name: Deploy en Orange Pi
    needs: build
    # Corre tras un build correcto, o directamente si es un rollback (build saltado).
    # Nunca fuera de la rama PROD.
    if: >-
      always() && github.ref == 'refs/heads/PROD' &&
      (needs.build.result == 'success' || (inputs.image_tag && needs.build.result == 'skipped'))
    runs-on: [self-hosted, linux, ARM64, messageflow-prod]
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Desplegar
        env:
          IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
        run: |
          # IMAGE_NAMESPACE se guarda en .env para que el compose apunte a este registro.
          grep -q '^IMAGE_NAMESPACE=' /opt/messageflow/.env \
            || printf '\nIMAGE_NAMESPACE=%s\n' "$IMAGE_NAMESPACE" >> /opt/messageflow/.env
          bash deploy/deploy.sh "$IMAGE_TAG"
